<form method="post" action="{$action}" class="af-aas-form-card" data-aas-form-mode="link_existing">
<input type="hidden" name="my_post_key" value="{$token}"><input type="hidden" name="do" value="link_existing">
<header class="af-aas-section-head"><i class="fa-solid fa-link" aria-hidden="true"></i><div><h2>Привязать существующий аккаунт</h2><p>Привяжите существующий аккаунт к вашему мастер-аккаунту.</p></div></header>
<label for="{$prefix}-link-name">Имя пользователя</label><div class="af-aas-field"><i class="fa-solid fa-user" aria-hidden="true"></i><input id="{$prefix}-link-name" name="link_username" type="text" data-aas-suggest-input autocomplete="off" required><input type="hidden" name="link_uid" data-aas-suggest-uid value="0"><div class="af-aas-suggest" data-aas-suggest-box hidden></div></div><p class="af-aas-form-hint">Начните вводить имя — появится список аккаунтов. Выберите нужный и введите его пароль.</p>
<label for="{$prefix}-link-password">Пароль этого аккаунта</label><div class="af-aas-field"><i class="fa-solid fa-lock" aria-hidden="true"></i><input id="{$prefix}-link-password" name="link_password" type="password" autocomplete="off" required><button type="button" data-aas-password aria-label="Показать пароль" aria-pressed="false"><i class="fa-solid fa-eye" aria-hidden="true"></i></button></div>
<button type="submit" class="af-aas-ui-button"><i class="fa-solid fa-link" aria-hidden="true"></i>Привязать аккаунт</button>
</form>
