<article class="atf-card atf-modcp-list-card atf-modcp-report-card inline_row">
  <div class="atf-modcp-report-card__content atf-card__body">{$report_data['content']}</div>
  <div class="atf-modcp-report-card__comment atf-card__body">{$report_data['comment']}</div>
  <dl class="atf-modcp-report-card__meta atf-card__metadata atf-meta">
    <div><dt>{$lang->report_count}</dt><dd>{$report_data['reports']}</dd></div>
    <div><dt>{$lang->report_lastpost}</dt><dd>{$report_data['lastreporter']}</dd></div>
  </dl>
  <label class="atf-modcp-report-card__select atf-card__actions">
    <input type="checkbox" class="checkbox" name="reports[]" id="reports_{$report['rid']}" value="{$report['rid']}"{$inlinecheck} />
    <span class="atf-modcp-report-card__select-label">#{$report['rid']}</span>
  </label>
</article>
