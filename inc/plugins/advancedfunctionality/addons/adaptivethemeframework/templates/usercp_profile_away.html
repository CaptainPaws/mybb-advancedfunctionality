<section class="atf-card atf-form-section">
<h2>{$lang->away_information}</h2>
<fieldset class="atf-form-row"><legend class="atf-form-row__label">{$lang->away_status}</legend><div class="atf-form-row__choices"><label><input type="radio" class="radio" name="away" value="1" {$awaycheck['1']} /> {$lang->im_away}</label><label><input type="radio" class="radio" name="away" value="0" {$awaycheck['0']} /> {$lang->im_here}</label></div></fieldset>
<label class="atf-form-row"><span class="atf-form-row__label">{$lang->away_reason}</span><input type="text" class="textbox" name="awayreason" value="{$user['awayreason']}" maxlength="200" /></label>
<div class="atf-form-row"><span class="atf-form-row__label">{$lang->return_date}</span><div class="atf-form-row__controls atf-form-row__controls--date"><select name="awayday"><option value="">&nbsp;</option>{$returndatesel}</select><select name="awaymonth"><option value="">&nbsp;</option><option value="1" {$returndatemonthsel['1']}>{$lang->month_1}</option><option value="2" {$returndatemonthsel['2']}>{$lang->month_2}</option><option value="3" {$returndatemonthsel['3']}>{$lang->month_3}</option><option value="4" {$returndatemonthsel['4']}>{$lang->month_4}</option><option value="5" {$returndatemonthsel['5']}>{$lang->month_5}</option><option value="6" {$returndatemonthsel['6']}>{$lang->month_6}</option><option value="7" {$returndatemonthsel['7']}>{$lang->month_7}</option><option value="8" {$returndatemonthsel['8']}>{$lang->month_8}</option><option value="9" {$returndatemonthsel['9']}>{$lang->month_9}</option><option value="10" {$returndatemonthsel['10']}>{$lang->month_10}</option><option value="11" {$returndatemonthsel['11']}>{$lang->month_11}</option><option value="12" {$returndatemonthsel['12']}>{$lang->month_12}</option></select><input type="text" class="textbox" size="4" maxlength="4" name="awayyear" value="{$returndate['2']}" /></div></div>
</section>
