<html>
<head>
<title>{$mybb->settings['bbname']} - {$lang->warning_logs}</title>
{$headerinclude}
</head>
<body>
{$header}
<main class="pun atf-page-shell atf-page atf-modcp" id="content">
<div class="atf-stack">
{$atf_modcp_global_navigation}
{$atf_modcp_local_navigation}
<header class="atf-modcp__header"><h1 class="atf-modcp__title">{$atf_modcp_title}</h1>{$atf_modcp_actions}</header>
{$atf_modcp_notice}
{$atf_modcp_before_content}
<div class="atf-modcp__content atf-modcp-warninglogs">
<section class="atf-card atf-modcp-panel">
  <header class="atf-modcp-panel__header"><h2>{$lang->warning_logs}</h2></header>
  <div class="atf-modcp-list atf-modcp-warning-list">{$warning_list}</div>
  {$multipage}
</section>
<section class="atf-card atf-modcp-panel">
  <header class="atf-modcp-panel__header"><h2>{$lang->filter_warning_logs}</h2></header>
  <form action="modcp.php" method="get" class="atf-stack">
    <input type="hidden" name="action" value="warninglogs" />
    <div class="atf-form-row">
      <label class="atf-form-row__label" for="username">{$lang->filter_warned_user}</label>
      <input type="text" name="filter[username]" id="username" value="{$filter_username}" class="textbox" />
    </div>
    <div class="atf-form-row">
      <label class="atf-form-row__label" for="atf-modcp-warning-mod">{$lang->filter_issued_by}</label>
      <input type="text" name="filter[mod_username]" id="atf-modcp-warning-mod" value="{$filter_modusername}" class="textbox" />
    </div>
    <div class="atf-form-row">
      <label class="atf-form-row__label" for="atf-modcp-warning-reason">{$lang->filter_reason}</label>
      <input type="text" name="filter[reason]" id="atf-modcp-warning-reason" value="{$filter_reason}" class="textbox" />
    </div>
    <div class="atf-modcp-filter__grid">
      <div class="atf-form-row">
        <label class="atf-form-row__label" for="atf-modcp-warning-sort">{$lang->sort_by}</label>
        <select name="filter[sortby]" id="atf-modcp-warning-sort">
          <option value="username"{$sortbysel['username']}>{$lang->username}</option>
          <option value="issuedby"{$sortbysel['issuedby']}>{$lang->issued_by}</option>
          <option value="dateline"{$sortbysel['dateline']}>{$lang->issued_date}</option>
          <option value="expires"{$sortbysel['expires']}>{$lang->expiry_date}</option>
        </select>
      </div>
      <div class="atf-form-row">
        <label class="atf-form-row__label" for="atf-modcp-warning-order">{$lang->order}</label>
        <select name="filter[order]" id="atf-modcp-warning-order">
          <option value="asc"{$ordersel['asc']}>{$lang->asc}</option>
          <option value="desc"{$ordersel['desc']}>{$lang->desc}</option>
        </select>
      </div>
      <div class="atf-form-row">
        <label class="atf-form-row__label" for="atf-modcp-warning-perpage">{$lang->per_page}</label>
        <input type="text" name="filter[per_page]" id="atf-modcp-warning-perpage" value="{$per_page}" class="textbox" />
      </div>
    </div>
    <div class="atf-modcp-form__actions"><input type="submit" class="button atf-button" value="{$lang->filter_warning_logs}" /></div>
  </form>
</section>
</div>
{$atf_modcp_after_content}
</div>
</main>
{$footer}

<script type="text/javascript" src="{$mybb->asset_url}/jscripts/select2/select2.min.js?ver=1806"></script>

</body>
</html>
