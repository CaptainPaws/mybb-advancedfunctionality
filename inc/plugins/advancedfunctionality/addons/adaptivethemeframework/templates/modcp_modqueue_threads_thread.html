<article class="atf-modcp-list-card atf-modcp-queue-card">
  <header class="atf-modcp-queue-card__header">
    <div class="atf-modcp-queue-card__identity">
      <h3><a href="{$thread['threadlink']}">{$thread['subject']}</a></h3>
      <div class="atf-meta">{$profile_link} · {$threaddate}</div>
    </div>
  </header>
  <div class="atf-modcp-queue-card__context">{$forum}</div>
  <div class="atf-modcp-queue-card__message">{$thread['postmessage']}</div>
  <fieldset class="atf-modcp-queue-card__controls">
    <legend>{$lang->controls}</legend>
    <label class="label_radio_ignore"><input type="radio" class="radio radio_ignore" name="threads[{$thread['tid']}]" value="ignore" checked="checked" /> {$lang->ignore}</label>
    <label class="label_radio_delete"><input type="radio" class="radio radio_delete" name="threads[{$thread['tid']}]" value="delete" /> {$lang->delete}</label>
    <label class="label_radio_approve"><input type="radio" class="radio radio_approve" name="threads[{$thread['tid']}]" value="approve" /> {$lang->approve}</label>
  </fieldset>
</article>
