<html>
<head>
<title>{$mybb->settings['bbname']} - {$lang->find_users}</title>
{$headerinclude}
</head>
<body class="atf-active" data-atf-owned="1">
{$header}
<main class="pun atf-page-shell atf-page atf-modcp" id="content">
<div class="atf-stack">
{$atf_modcp_global_navigation}
{$atf_modcp_local_navigation}
<header class="atf-modcp__header"><h1 class="atf-modcp__title">{$atf_modcp_title}</h1>{$atf_modcp_actions}</header>
{$atf_modcp_notice}
{$atf_modcp_before_content}
<div class="atf-modcp__content atf-modcp-finduser">
<section class="atf-card atf-modcp-panel">
  <header class="atf-modcp-panel__header"><h2>{$lang->users}</h2></header>
  <div class="atf-modcp-list atf-modcp-user-list">{$users}</div>
  {$multipage}
</section>
<section class="atf-card atf-modcp-panel">
  <header class="atf-modcp-panel__header"><h2>{$lang->find_users}</h2></header>
  <form action="modcp.php?action=finduser" method="post" class="atf-stack">
    <div class="atf-form-row">
      <label class="atf-form-row__label" for="username">{$lang->username_contains}</label>
      <input type="text" name="username" id="username" value="{$username}" class="textbox" />
    </div>
    <div class="atf-modcp-filter__grid">
      <div class="atf-form-row">
        <label class="atf-form-row__label" for="atf-modcp-finduser-sort">{$lang->sort_by}</label>
        <select name="sortby" id="atf-modcp-finduser-sort">
          <option value="username"{$sortbysel['username']}>{$lang->username}</option>
          <option value="regdate"{$sortbysel['regdate']}>{$lang->regdate}</option>
          <option value="lastvisit"{$sortbysel['lastvisit']}>{$lang->lastvisit}</option>
          <option value="postnum"{$sortbysel['postnum']}>{$lang->postnum}</option>
        </select>
      </div>
      <div class="atf-form-row">
        <label class="atf-form-row__label" for="atf-modcp-finduser-order">{$lang->order}</label>
        <select name="order" id="atf-modcp-finduser-order">
          <option value="asc"{$ordersel['asc']}>{$lang->asc}</option>
          <option value="desc"{$ordersel['desc']}>{$lang->desc}</option>
        </select>
      </div>
    </div>
    <div class="atf-modcp-form__actions"><input type="submit" class="button atf-button" value="{$lang->find_users}" /></div>
  </form>
</section>
</div>
{$atf_modcp_after_content}
</div>
</main>
{$footer}
<link rel="stylesheet" href="{$mybb->asset_url}/jscripts/select2/select2.css?ver=1807" />
<script type="text/javascript" src="{$mybb->asset_url}/jscripts/select2/select2.min.js?ver=1806"></script>
<script type="text/javascript">

</script>
<atf-footer-placement></atf-footer-placement>
</body>
</html>
