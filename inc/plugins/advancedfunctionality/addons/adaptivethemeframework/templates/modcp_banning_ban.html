<article class="atf-modcp-list-card atf-modcp-ban-card {$banned_class}">
  <header class="atf-modcp-ban-card__header">
    <div class="atf-modcp-ban-card__user">{$profile_link}</div>
    <div class="atf-modcp-ban-card__actions">{$edit_link}</div>
  </header>
  <div class="atf-modcp-ban-card__reason">{$banned['reason']}</div>
  <dl class="atf-modcp-ban-card__meta atf-meta">
    <div><dt>{$lang->ban_length}</dt><dd>{$banlength}<span class="atf-modcp-ban-card__remaining">{$timeremaining}</span></dd></div>
    <div><dt>{$lang->ban_bannedby}</dt><dd>{$admin_profile}</dd></div>
  </dl>
</article>
