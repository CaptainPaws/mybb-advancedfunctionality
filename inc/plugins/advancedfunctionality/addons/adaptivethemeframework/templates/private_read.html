<html>
<head>
<title>{$lang->viewing_pm} {$pm['subject']}</title>
{$headerinclude}
</head>
<body class="atf-active" data-atf-owned="1">
{$header}
<main class="pun atf-page-shell atf-page atf-pm atf-pm-read">
	<div class="atf-pm__navigation">{$atf_pm_navigation}</div>
	{$atf_pm_before_content}
	<header class="atf-pm-read__header atf-card">
		<p class="atf-pm__eyebrow">{$lang->private_messaging}</p>
		<h1 class="atf-pm__title">{$pm['subject']}</h1>
		<div class="atf-pm-read__action">{$action_time}</div>
	</header>
	<section class="atf-pm-read__conversation" aria-label="{$pm['subject']}">
		<div id="posts_container">
			<div id="posts">{$message}</div>
		</div>
	</section>
	{$quickreply}
	{$atf_pm_after_content}
</main>
{$footer}
<atf-footer-placement></atf-footer-placement>
</body>
</html>
