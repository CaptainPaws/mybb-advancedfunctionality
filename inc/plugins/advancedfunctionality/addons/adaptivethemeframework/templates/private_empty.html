<html>
<head>
<title>{$mybb->settings['bbname']} - {$lang->empty_folders}</title>
{$headerinclude}
</head>
<body>
{$header}
<main class="pun atf-page-shell atf-page atf-pm atf-pm-folders atf-pm-empty">
	<div class="atf-pm__global-navigation">{$atf_ucp_global_navigation}</div>
	<div class="atf-pm__navigation">{$atf_pm_navigation}</div>
	<header class="atf-pm__header atf-card"><div class="atf-pm__heading"><p class="atf-pm__eyebrow">{$lang->private_messaging}</p><h1 class="atf-pm__title">{$lang->empty_folders}</h1></div></header>
	<form action="private.php" method="post" class="atf-pm-folders__form atf-stack">
		<input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
		<section class="atf-pm-folders__section atf-card atf-stack">
			<p class="atf-form-row__hint">{$lang->empty_note}</p>
			<div class="atf-pm-empty__head"><span>{$lang->export_folder}</span><span>{$lang->num_messages}</span><span>{$lang->empty_q}</span></div>
			<div class="atf-pm-folders__list atf-stack atf-stack--compact">{$folderlist}</div>
			<label class="atf-form-row atf-pm-empty__keep"><input type="checkbox" class="checkbox" name="keepunread" value="1" checked="checked" /><strong>{$lang->keep_unread}</strong></label>
		</section>
		<input type="hidden" name="action" value="do_empty" />
		<div class="atf-pm-folders__actions atf-pm-empty__actions"><input type="submit" class="atf-button atf-button--danger" name="submit" value="{$lang->delete}" /></div>
	</form>
</main>
{$footer}
</body>
</html>
