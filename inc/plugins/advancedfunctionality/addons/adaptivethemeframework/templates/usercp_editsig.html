<html><head><title>{$mybb->settings['bbname']} - {$lang->edit_sig}</title>{$headerinclude}</head><body>
{$header}
<main class="pun atf-page-shell atf-page atf-ucp atf-ucp-form" id="content"><div class="atf-stack">
{$atf_ucp_global_navigation}{$atf_ucp_local_navigation}
<header class="atf-ucp__header"><h1 class="atf-ucp__title">{$lang->edit_sig}</h1></header>
{$error}{$signature}
<form action="usercp.php" method="post" class="atf-stack atf-signature-form">
<input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
<section class="atf-card atf-signature-editor">
<div class="atf-signature-editor__aside"><p class="atf-form-row__hint">{$lang->edit_sig_note}</p>{$smilieinserter}</div>
<div class="atf-signature-editor__input"><textarea rows="15" cols="70" id="signature" name="signature">{$sig}</textarea>{$codebuttons}</div>
</section>
<fieldset class="atf-card atf-form-row"><legend class="atf-form-row__label">{$lang->edit_sig_note2}</legend><div class="atf-form-row__choices atf-form-row__choices--stack"><label><input type="radio" class="radio" name="updateposts" value="enable" /> {$lang->enable_sig_posts}</label><label><input type="radio" class="radio" name="updateposts" value="disable" /> {$lang->disable_sig_posts}</label><label><input type="radio" class="radio" name="updateposts" value="0" checked="checked" /> {$lang->leave_sig_settings}</label></div></fieldset>
<div class="atf-form-actions"><input type="hidden" name="action" value="do_editsig" /><input type="submit" class="button atf-button" name="submit" value="{$lang->update_sig}" /><input type="submit" class="button atf-button" name="preview" value="{$lang->preview}" /></div>
</form></div></main>{$footer}</body></html>
