<html>
<head><title>{$mybb->settings['bbname']} - {$lang->split_thread}</title>{$headerinclude}</head>
<body>{$header}
<main class="pun atf-page-shell atf-page atf-moderation" id="content"><form action="moderation.php" method="post" class="atf-moderation__form">
