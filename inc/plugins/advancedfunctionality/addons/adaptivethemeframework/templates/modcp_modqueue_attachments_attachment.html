<article class="atf-modcp-list-card atf-modcp-queue-card atf-modcp-queue-card--attachment">
  <header class="atf-modcp-queue-card__header">
    <div class="atf-modcp-queue-card__identity">
      <h3><a href="attachment.php?aid={$attachment['aid']}" target="_blank">{$attachment['filename']}</a></h3>
      <div class="atf-meta">{$attachment['filesize']} · {$profile_link} · {$attachdate}</div>
    </div>
  </header>
  <div class="atf-modcp-queue-card__context">{$lang->post}: <a href="{$link}">{$attachment['postsubject']}</a></div>
  <fieldset class="atf-modcp-queue-card__controls">
    <legend>{$lang->controls}</legend>
    <label class="label_radio_ignore"><input type="radio" class="radio radio_ignore" name="attachments[{$attachment['aid']}]" value="ignore" checked="checked" /> {$lang->ignore}</label>
    <label class="label_radio_delete"><input type="radio" class="radio radio_delete" name="attachments[{$attachment['aid']}]" value="delete" /> {$lang->delete}</label>
    <label class="label_radio_approve"><input type="radio" class="radio radio_approve" name="attachments[{$attachment['aid']}]" value="approve" /> {$lang->approve}</label>
  </fieldset>
</article>
