<html>
<head>
<title>{$mybb->settings['bbname']} - {$lang->ban_user}</title>
{$headerinclude}
</head>
<body>
{$header}
<main class="pun atf-page-shell atf-page atf-modcp" id="content">
<div class="atf-stack">
{$atf_modcp_global_navigation}
{$atf_modcp_local_navigation}
<header class="atf-modcp__header"><h1 class="atf-modcp__title">{$atf_modcp_title}</h1>{$atf_modcp_actions}</header>
{$atf_modcp_notice}
{$atf_modcp_before_content}
<div class="atf-modcp__content atf-modcp-banuser">
{$errors}
<form action="modcp.php" method="post" class="atf-stack atf-modcp-banuser__form">
  <input type="hidden" name="action" value="do_banuser" />
  <input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
  <input type="hidden" name="uid" value="{$uid}" />
  <section class="atf-card atf-form-section">
    <header class="atf-modcp-panel__header atf-modcp-panel__header--split">
      <h2>{$lang->ban_user}</h2>
      <div class="atf-modcp-banuser__lift">{$lift_link}</div>
    </header>
    {$banuser_username}
    <label class="atf-form-row">
      <span class="atf-form-row__label">{$lang->ban_reason}</span>
      <textarea name="banreason" cols="60" rows="4" maxlength="255">{$banreason}</textarea>
    </label>
    {$bangroups}
    <label class="atf-form-row">
      <span class="atf-form-row__label">{$lang->ban_liftafter}</span>
      <select name="liftafter">{$liftlist}</select>
    </label>
  </section>
  <div class="atf-modcp-form__actions">
    <input type="submit" class="button atf-button" name="updateban" value="{$lang->ban}" />
  </div>
</form>
</div>
{$atf_modcp_after_content}
</div>
</main>
{$footer}
<link rel="stylesheet" href="{$mybb->asset_url}/jscripts/select2/select2.css?ver=1807">
<script type="text/javascript" src="{$mybb->asset_url}/jscripts/select2/select2.min.js?ver=1806"></script>

</body>
</html>
