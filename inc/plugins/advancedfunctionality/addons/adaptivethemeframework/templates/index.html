<html>
<head>
<title>{$mybb->settings['bbname']}</title>
{$headerinclude}
<script type="text/javascript">
<!--
	lang.no_new_posts = "{$lang->no_new_posts}";
	lang.click_mark_read = "{$lang->click_mark_read}";
// -->
</script>
</head>
<body>
{$header}
<main class="pun atf-page-shell atf-page atf-index" id="content">
  <header class="atf-index__hero atf-stack atf-stack--compact">
    <h1 class="atf-index__title">{$mybb->settings['bbname']}</h1>
  </header>
  <section class="atf-index__section atf-index__news" aria-label="Announcements">{$fastnews}</section>
  <section class="atf-index__section atf-index__forums" aria-label="Forums">
    <!-- Existing forumbit output intentionally remains compatibility content. -->
    {$forums}
  </section>
  <section class="atf-index__section atf-index__statistics" aria-label="Statistics">{$boardstats}</section>
  <section class="atf-index__section atf-index__legend" aria-label="Forum status legend">
    <dl class="forum_legend smalltext">
      <dt><span class="forum_status forum_on" title="{$lang->new_posts}"></span></dt><dd>{$lang->new_posts}</dd>
      <dt><span class="forum_status forum_off" title="{$lang->no_new_posts}"></span></dt><dd>{$lang->no_new_posts}</dd>
      <dt><span class="forum_status forum_offclose" title="{$lang->forum_closed}"></span></dt><dd>{$lang->forum_closed}</dd>
      <dt><span class="forum_status forum_offlink" title="{$lang->forum_redirect}"></span></dt><dd>{$lang->forum_redirect}</dd>
    </dl>
  </section>
</main>
{$footer}
</body>
</html>
