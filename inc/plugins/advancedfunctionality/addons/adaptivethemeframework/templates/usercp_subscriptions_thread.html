<article class="atf-card atf-subscription-card"><div class="atf-subscription-card__status atf-card__status atf-status"><span class="thread_status {$folder}" title="{$folder_label}" aria-label="{$folder_label}">&nbsp;</span>{$icon}</div><div class="atf-subscription-card__body atf-card__body"><h2 class="atf-card__title">{$gotounread}{$thread['threadprefix']}<a href="{$thread['threadlink']}" class="{$new_class}">{$thread['subject']}</a></h2><p class="atf-meta atf-card__metadata"><a href="forumdisplay.php?fid={$thread['fid']}">{$lang->forum}</a> · {$lang->notification_method} {$notification_type}</p><div class="atf-subscription-card__metrics atf-card__metadata"><span>{$lang->replies}: <a href="{$mybb->settings['bburl']}/misc.php?action=whoposted&amp;tid={$thread['tid']}" onclick="MyBB.whoPosted({$thread['tid']}); return false;">{$thread['replies']}</a></span><span>{$lang->views}: {$thread['views']}</span><span>{$lastpostdate} · <a href="{$thread['lastpostlink']}">{$lang->lastpost}</a>: {$lastposterlink}</span></div></div><label class="atf-subscription-card__check"><span class="atf-visually-hidden">{$lang->with_selected}</span><input type="checkbox" class="checkbox" name="check[{$thread['tid']}]" value="{$thread['tid']}"></label></article>
