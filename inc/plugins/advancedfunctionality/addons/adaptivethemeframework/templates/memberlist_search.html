<html>
<head><title>{$mybb->settings['bbname']} - {$lang->search_member_list}</title>{$headerinclude}</head>
<body>{$header}
<main class="pun atf-page-shell atf-page atf-userlist"><form method="post" action="memberlist.php" class="atf-card atf-userlist__filters">
  <h1>{$lang->search_member_list}</h1><h2>{$lang->search_criteria}</h2>
  <div class="atf-form-grid">
    <label for="username">{$lang->username}<span><select name="username_match"><option value="begins">{$lang->begins_with}</option><option value="contains">{$lang->username_contains}</option><option value="exact">{$lang->username_exact}</option></select></span><input type="text" class="textbox" name="username" id="username" /></label>
    <label for="website">{$lang->search_website}<input type="text" class="textbox" name="website" id="website" /></label>
    <label for="sort">{$lang->sort_by}<select name="sort" id="sort"><option value="username">{$lang->sort_by_username}</option><option value="regdate">{$lang->sort_by_regdate}</option><option value="lastvisit">{$lang->sort_by_lastvisit}</option><option value="postnum">{$lang->sort_by_posts}</option><option value="threadnum">{$lang->sort_by_threads}</option>{$referrals_option}</select></label>
    <label for="perpage">{$lang->per_page}<input type="number" class="textbox" min="1" max="500" name="perpage" id="perpage" value="15" /></label>
  </div>
  <div class="atf-form-actions"><label><input type="radio" name="order" value="ascending" />{$lang->order_asc}</label><label><input type="radio" name="order" value="descending" checked="checked" />{$lang->order_desc}</label><input type="submit" class="button" value="{$lang->search}" /></div>
</form></main>{$footer}</body></html>
