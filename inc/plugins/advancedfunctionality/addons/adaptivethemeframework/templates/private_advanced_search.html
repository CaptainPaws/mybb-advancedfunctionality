<html>
<head>
<title>{$mybb->settings['bbname']} - {$lang->advanced_private_message_search}</title>
{$headerinclude}
</head>
<body>
{$header}
<main class="atf-pm atf-pm-search">
	<nav class="atf-pm__navigation" aria-label="{$lang->private_messaging}">{$atf_pm_navigation}</nav>
	<header class="atf-pm__header atf-card"><div class="atf-pm__heading"><p class="atf-pm__eyebrow">{$lang->private_messaging}</p><h1 class="atf-pm__title">{$lang->advanced_private_message_search}</h1></div><div class="atf-pm__links"><a href="private.php">{$lang->inbox}</a></div></header>
	<form action="private.php" method="post" name="pmForm" class="atf-pm-search__form">
		<input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
		<input type="hidden" name="action" value="do_search" />
		<section class="atf-section atf-card">
			<h2>{$lang->search_criteria}</h2>
			<div class="atf-form-row"><label class="atf-form-row__label" for="keywords">{$lang->keywords}</label><input type="text" class="textbox" name="keywords" id="keywords" size="35" maxlength="250" /><div class="atf-form-row__hint"><label><input type="checkbox" name="subject" checked="checked" value="1" /> {$lang->search_in_subject}</label><label><input type="checkbox" name="message" checked="checked" value="1" /> {$lang->search_in_message}</label></div></div>
			<div class="atf-form-row"><label class="atf-form-row__label" for="sender">{$lang->sender}</label><input type="text" class="textbox" name="sender" id="sender" size="35" maxlength="250" /></div>
			<fieldset class="atf-form-row"><legend class="atf-form-row__label">{$lang->message_status}</legend><div class="atf-form-row__choices"><label><input type="checkbox" name="status[new]" checked="checked" value="1" /> {$lang->message_status_new}</label><label><input type="checkbox" name="status[replied]" checked="checked" value="1" /> {$lang->message_status_replied_to}</label><label><input type="checkbox" name="status[forwarded]" checked="checked" value="1" /> {$lang->message_status_forwarded}</label><label><input type="checkbox" name="status[read]" checked="checked" value="1" /> {$lang->message_status_read}</label></div></fieldset>
			<div class="atf-form-row"><label class="atf-form-row__label" for="folder">{$lang->folder}</label>{$foldersearch}</div>
		</section>
		<section class="atf-section atf-card">
			<h2>{$lang->search_options}</h2>
			<div class="atf-form-row"><label class="atf-form-row__label" for="sort">{$lang->sort_by}</label><select name="sort" id="sort"><option value="subject">{$lang->sort_by_subject}</option><option value="sender">{$lang->sort_by_sender}</option><option value="dateline" selected="selected">{$lang->sort_by_date}</option></select><div class="atf-form-row__choices"><label><input type="radio" class="radio" name="sortordr" id="order_asc" value="asc" /> {$lang->ascending_order}</label><label><input type="radio" class="radio" name="sortordr" id="order_desc" checked="checked" value="desc" /> {$lang->descending_order}</label></div></div>
		</section>
		<div class="atf-pm-search__submit"><input type="submit" value="{$lang->search_private_messages}" class="button" /></div>
	</form>
</main>
{$footer}
<link rel="stylesheet" href="{$mybb->asset_url}/jscripts/select2/select2.css?ver=1807" />
<script type="text/javascript" src="{$mybb->asset_url}/jscripts/select2/select2.min.js?ver=1806"></script>
<script type="text/javascript">
if(use_xmlhttprequest == "1") { MyBB.select2(); $("#sender").select2({placeholder: "{$lang->search_user}", minimumInputLength: 2, multiple: false, allowClear: true, ajax: {url: "xmlhttp.php?action=get_users", dataType: 'json', data: function (term) { return {query: term}; }, results: function (data) { return {results: data}; }}, initSelection: function(element, callback) { var value = $(element).val(); if (value !== "") { callback({id: value, text: value}); } }}); }
</script>
</body>
</html>
