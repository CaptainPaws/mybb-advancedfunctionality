<div class="af-cs-page af-aa-context af-aa-context--sheet" data-element-surface="sheet" data-element="{$sheet_element_theme_key}" data-af-apui-surface="sheet" data-af-modal-kind="sheet" data-af-apui-owner-uid="{$sheet_owner_uid}" data-uid="{$sheet_owner_uid}" data-afcs-sheet data-afcs-sheet-id="{$sheet_id}" data-afcs-tab-url="{$sheet_tab_url}" data-afcs-arsenal-url="{$sheet_arsenal_url}" data-afcs-sheet-mode="{$sheet_mode_attr}" data-afcs-post-key="{$sheet_post_key}" data-afcs-bonus-items="{$bonus_items_json}" data-af-element-source="sheet" data-af-element-accent-root="sheet">
  <div class="af-cs-inline-error" data-afcs-error="1" hidden></div>
  <div class="af-cs-toast" data-afcs-toast="1" hidden></div>
  <div class="af-cs-hero">
    <div class="af-cs-portrait">
      <img src="{$sheet_portrait_url}" alt="{$sheet_title}" loading="lazy" />
    </div>
    <div class="af-cs-summary">
      <div class="af-cs-summary__head">
        <div class="af-cs-summary__title-row">
          <h1>{$sheet_title}</h1>
          <div class="af-cs-header-actions">
            {$sheet_header_actions_html}
          </div>
        </div>
        <div class="af-cs-name-ru">
          <span class="af-cs-name-ru__main">{$sheet_name_ru}</span>
          <span class="af-cs-name-ru__nick">{$sheet_nicknames}</span>
        </div>
      </div>
      <div class="af-cs-level">
        <div data-afcs-block="progress">
          {$sheet_progress_html}
        </div>
      </div>

      <div class="af-cs-summary__info">
        {$sheet_info_table_html}
      </div>
    </div>
  </div>

  <section class="af-cs-section">
    <div class="af-cs-tabs" data-afcs-tabs>
      <div class="af-cs-tabs__nav">
        <button class="is-active" type="button" data-afcs-tab="main">Основная информация</button>
        <button type="button" data-afcs-tab="application">Анкета</button>
        <button type="button" data-afcs-tab="skills">Навыки</button>
        <button type="button" data-afcs-tab="knowledge">Знания</button>
        <button type="button" data-afcs-tab="abilities">Способности</button>
        <button type="button" data-afcs-tab="arsenal">Арсенал</button>
        <button type="button" data-afcs-tab="augments">Аугментации</button>
        <button type="button" data-afcs-tab="equipment">Экипировка</button>
      </div>
      <div class="af-cs-tabs__content">
        <div class="af-cs-tab is-active" data-afcs-tab-content="main" data-afcs-main-refresh>
            <section class="af-cs-section">
            <div data-afcs-block="attributes">
              {$sheet_attributes_html}
            </div>
            </section>

            <section class="af-cs-section">
              <h2>{$sheet_mechanics_title}</h2>
              <div data-afcs-block="mechanics">
                {$sheet_mechanics_html}
              </div>
            </section>
          {$sheet_bonus_html}
        </div>
        <div class="af-cs-tab" data-afcs-tab-content="skills" data-afcs-lazy="1">
        </div>
        <div class="af-cs-tab" data-afcs-tab-content="application" data-afcs-lazy="1">
        </div>
        <div class="af-cs-tab" data-afcs-tab-content="knowledge" data-afcs-lazy="1">
        </div>
        <div class="af-cs-tab" data-afcs-tab-content="abilities" data-afcs-lazy="1">
        </div>
        <div class="af-cs-tab" data-afcs-tab-content="arsenal" data-afcs-lazy="1">
        </div>
        <div class="af-cs-tab" data-afcs-tab-content="augments" data-afcs-lazy="1">
        </div>
        <div class="af-cs-tab" data-afcs-tab-content="equipment" data-afcs-lazy="1">
        </div>
      </div>
    </div>
  </section>
</div>
