<div class="af-cs-page af-cs-page--arpg af-aa-context af-aa-context--sheet"
     data-element-surface="sheet" data-element="{$sheet_element_theme_key}"
     data-af-apui-surface="sheet"
     data-af-modal-kind="sheet"
     data-af-apui-owner-uid="{$sheet_owner_uid}"
     data-uid="{$sheet_owner_uid}"
     data-afcs-sheet
     data-afcs-sheet-id="{$sheet_id}"
     data-afcs-tab-url="{$sheet_tab_url}"
     data-afcs-arsenal-url="{$sheet_arsenal_url}"
     data-afcs-sheet-mode="{$sheet_mode_attr}"
     data-afcs-render-profile="{$sheet_render_profile_attr}"
     data-afcs-render-override="{$sheet_render_override_mode}"
     data-afcs-post-key="{$sheet_post_key}"
     data-afcs-bonus-items="{$bonus_items_json}" data-af-element-effect-host>
  <span hidden data-af-element-effect aria-hidden="true"></span>
  <div class="af-cs-inline-error" data-afcs-error="1" hidden></div>
  <div class="af-cs-toast" data-afcs-toast="1" hidden></div>

  <header class="af-cs-arpg-top">
    <div class="af-cs-arpg-top__art">
      <div class="af-cs-portrait af-cs-arpg-hero__portrait">
        <img src="{$sheet_portrait_url}" alt="{$sheet_title}" loading="lazy" />
      </div>
    </div>
    <div class="af-cs-arpg-top__right">
      {$sheet_arpg_identity_block_html}
      {$sheet_arpg_main_info_html}
    </div>
  </header>

  <section class="af-cs-section af-cs-arpg-tabs-wrap">
    <div class="af-cs-tabs" data-afcs-tabs>
      <div class="af-cs-tabs__nav">
        <button class="is-active" type="button" data-afcs-tab="arpg-main">Основная информация</button>
        <button type="button" data-afcs-tab="arpg-talents">Таланты</button>
        <button type="button" data-afcs-tab="arpg-abilities">Способности</button>
        <button type="button" data-afcs-tab="arpg-arsenal">Арсенал</button>
        <button type="button" data-afcs-tab="arpg-equipment">Экипировка</button>
      </div>
      <div class="af-cs-tabs__content">
        <div class="af-cs-tab is-active" data-afcs-tab-content="arpg-main" data-afcs-main-refresh>
          {$sheet_arpg_stats_block_html}
          {$sheet_arpg_description_block_html}
        </div>

        <div class="af-cs-tab" data-afcs-tab-content="arpg-talents" data-afcs-lazy="1">
        </div>

        <div class="af-cs-tab" data-afcs-tab-content="arpg-abilities" data-afcs-lazy="1">
        </div>

        <div class="af-cs-tab" data-afcs-tab-content="arpg-arsenal" data-afcs-lazy="1">
        </div>

        <div class="af-cs-tab" data-afcs-tab-content="arpg-equipment" data-afcs-lazy="1">
        </div>
      </div>
  </section>
</div>
