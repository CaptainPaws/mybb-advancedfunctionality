<article id="pm_{$message['pmid']}" class="am-pm-card am-pm-card--search am-card {$msgstatus}" data-pm-id="{$message['pmid']}">
	<div class="am-pm-card__avatar"><am-pm-avatar data-uid="{$tofromuid}"></am-pm-avatar></div>
	<div class="am-pm-card__content">
		<h2 class="am-pm-card__subject"><a class="{$msgstatus}" href="private.php?action=read&amp;pmid={$message['pmid']}">{$message['subject']}</a></h2>
		<div class="am-pm-card__correspondent">{$tofromusername}</div>
		<div class="am-pm-card__meta"><span class="am-pm-card__state"><img src="{$theme['imgdir']}/{$msgstatus}.png" alt="{$msgalt}" title="{$msgalt}" /></span><span class="am-pm-card__icon">{$icon}</span><time class="am-pm-card__date">{$senddate}</time><span class="am-pm-card__folder"><a href="private.php?fid={$message['folder']}">{$foldername}</a></span></div>
		<div class="am-pm-card__receipt">{$denyreceipt}</div>
		<div class="am-pm-card__snippet">{$message['message']}</div>
	</div>
	<label class="am-pm-card__check"><span class="am-visually-hidden">{$lang->select_message}</span><input type="checkbox" class="checkbox" name="check[{$message['pmid']}]" value="1" /></label>
</article>
