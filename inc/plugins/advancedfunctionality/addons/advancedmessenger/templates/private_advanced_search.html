<html><head>
<title>{$am_label_search_title}</title>{$headerinclude}
</head><body class="{$am_body_class}" data-atf-owned="1" {$am_layout_attr}>
{$am_header}{$am_outer_start}
<header class="am-search-heading"><h1>{$am_label_search_title}</h1></header>
<form action="private.php" method="post" name="pmForm" class="am-pm-search__form am-search-form">
<input type="hidden" name="am_panel" value="{$am_panel}" />
<input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
<input type="hidden" name="action" value="do_search" /><input type="hidden" name="am_peer" value="{$am_search_peer}" />
<div class="am-search-fields">
<section class="am-search-group"><h2>{$am_label_criteria}</h2><div class="am-search-grid">
<div class="am-form-row am-search-wide"><label for="keywords">{$lang->keywords}</label>
<div class="am-search-control"><input type="search" name="keywords" id="keywords" maxlength="250" placeholder="{$lang->keywords}" /><i class="fa-solid fa-magnifying-glass am-field-icon" aria-hidden="true"></i></div>
<div class="am-choice-row"><label><input type="checkbox" name="subject" checked="checked" value="1" /> {$lang->search_in_subject}</label><label><input type="checkbox" name="message" checked="checked" value="1" /> {$lang->search_in_message}</label></div></div>
<div class="am-form-row"><label for="sender">{$lang->sender}</label><input type="text" name="sender" id="sender" maxlength="250" /></div>
<div class="am-form-row"><label for="am-recipient">{$am_label_recipient}</label><input type="text" name="am_recipient" id="am-recipient" maxlength="120" /><small>{$am_label_recipient_hint}</small></div>
</div></section>
<section class="am-search-group"><h2>{$am_label_filters}</h2>
<fieldset><legend>{$lang->message_status}</legend><div class="am-choice-row">
<label><input type="checkbox" name="status[new]" checked="checked" value="1" /> {$lang->message_status_new}</label>
<label><input type="checkbox" name="status[replied]" checked="checked" value="1" /> {$lang->message_status_replied_to}</label>
<label><input type="checkbox" name="status[forwarded]" checked="checked" value="1" /> {$lang->message_status_forwarded}</label>
<label><input type="checkbox" name="status[read]" checked="checked" value="1" /> {$lang->message_status_read}</label>
</div></fieldset>
<fieldset><legend>{$lang->folder}</legend>{$am_search_folders}</fieldset>
</section>
<section class="am-search-group"><h2>{$am_label_sorting}</h2><div class="am-search-grid">
<div class="am-form-row"><label for="sort">{$lang->sort_by}</label><select name="sort" id="sort"><option value="subject">{$lang->sort_by_subject}</option><option value="sender">{$lang->sort_by_sender}</option><option value="dateline" selected="selected">{$lang->sort_by_date}</option></select></div>
<fieldset><legend>{$lang->sort_by}</legend><div class="am-choice-row"><label><input type="radio" name="sortordr" value="asc" /> {$lang->ascending_order}</label><label><input type="radio" name="sortordr" checked="checked" value="desc" /> {$lang->descending_order}</label></div></fieldset>
</div></section>
</div>
<footer class="am-search-footer"><button type="button" data-am-cancel="1">{$am_label_cancel}</button><button type="submit" class="am-primary" value="{$lang->search_private_messages}"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span>{$am_label_search_submit}</span></button></footer>
</form>
{$am_outer_end}{$am_footer}
<link rel="stylesheet" href="{$mybb->asset_url}/jscripts/select2/select2.css?ver=1807" />
<script type="text/javascript" src="{$mybb->asset_url}/jscripts/select2/select2.min.js?ver=1806"></script>
<script type="text/javascript">
if(use_xmlhttprequest == "1") { MyBB.select2(); $("#sender").select2({placeholder: "{$lang->search_user}", minimumInputLength: 2, multiple: false, allowClear: true, ajax: {url: "xmlhttp.php?action=get_users", dataType: 'json', data: function (term) { return {query: term}; }, results: function (data) { return {results: data}; }}, initSelection: function(element, callback) { var value = $(element).val(); if (value !== "") { callback({id: value, text: value}); } }}); }
</script>

</body></html>
