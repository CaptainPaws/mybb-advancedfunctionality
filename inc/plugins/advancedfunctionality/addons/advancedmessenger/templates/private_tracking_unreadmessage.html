<article class="am-pm-tracking-card am-pm-tracking-card--unread am-card" data-pm-id="{$unreadmessage['pmid']}">
	<div class="am-pm-tracking-card__state"><img src="{$theme['imgdir']}/new_pm.png" alt="" /></div>
	<h3 class="am-pm-tracking-card__subject">{$unreadmessage['subject']}</h3>
	<div class="am-pm-tracking-card__recipient">{$unreadmessage['profilelink']}</div>
	<time class="am-pm-tracking-card__date">{$senddate}</time>
	<label class="am-pm-tracking-card__check"><span class="am-visually-hidden">{$unreadmessage['subject']}</span><input type="checkbox" class="checkbox" name="unreadcheck[{$unreadmessage['pmid']}]" value="1" /></label>
</article>
