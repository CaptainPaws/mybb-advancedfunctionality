<article class="am-pm-tracking-card am-pm-tracking-card--read am-card" data-pm-id="{$readmessage['pmid']}">
	<div class="am-pm-tracking-card__state"><img src="{$theme['imgdir']}/old_pm.png" alt="" /></div>
	<h3 class="am-pm-tracking-card__subject">{$readmessage['subject']}</h3>
	<div class="am-pm-tracking-card__recipient">{$readmessage['profilelink']}</div>
	<time class="am-pm-tracking-card__date">{$readdate}</time>
	<label class="am-pm-tracking-card__check"><span class="am-visually-hidden">{$readmessage['subject']}</span><input type="checkbox" class="checkbox" name="readcheck[{$readmessage['pmid']}]" value="1" /></label>
</article>
