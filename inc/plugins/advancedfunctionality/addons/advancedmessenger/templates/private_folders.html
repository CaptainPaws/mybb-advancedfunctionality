<html>
<head>
<title>{$mybb->settings['bbname']} - {$lang->pm_folders}</title>
{$headerinclude}
</head>
<body class="{$am_body_class}" data-atf-owned="1" {$am_layout_attr}>
{$am_header}
{$am_outer_start}
	<header class="am-pm__header am-card"><div class="am-pm__heading"><p class="am-pm__eyebrow">{$lang->private_messaging}</p><h1 class="am-pm__title">{$lang->pm_folders}</h1></div></header>
	<form action="private.php" method="post" class="am-pm-folders__form am-stack"><input type="hidden" name="am_panel" value="{$am_panel}" />
		<input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
		<section class="am-pm-folders__section am-card am-stack">
			<h2>{$lang->existing_folders}</h2>
			<p class="am-form-row__hint">{$lang->edit_folder_note}</p>
			<div class="am-pm-folders__list am-stack am-stack--compact">{$folderlist}</div>
		</section>
		<section class="am-pm-folders__section am-card am-stack">
			<h2>{$lang->new_folders}</h2>
			<p class="am-form-row__hint">{$lang->add_folders_note}</p>
			<div class="am-pm-folders__list am-stack am-stack--compact">{$newfolders}</div>
		</section>
		<input type="hidden" name="action" value="do_folders" />
		<div class="am-pm-folders__actions"><button type="submit" class="am-button" name="submit" value="{$lang->update_folders}" ><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>{$lang->update_folders}</span></button></div>
	</form>
{$am_outer_end}
{$am_footer}

</body>
</html>
