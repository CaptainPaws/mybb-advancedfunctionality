<div class="af-kb-category-toolbar">
    <form class="af-kb-search af-kb-category-search" method="get" action="misc.php">
        <input type="hidden" name="action" value="kb" />
        <input type="hidden" name="type" value="{$kb_type_value}" />
        <span class="af-kb-category-search__icon" aria-hidden="true"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" name="q" value="{$kb_query}" placeholder="{$lang->af_kb_search_placeholder}" aria-label="{$lang->af_kb_search_placeholder}" />
    </form>
    <div class="af-kb-actions af-kb-category-actions">
        {$kb_type_actions}
        {$kb_help_link}
    </div>
</div>
<header class="af-kb-type-header af-kb-category-heading">
    {$kb_type_heading}
    <span class="af-kb-category-divider" aria-hidden="true"></span>
    <div class="af-kb-type-desc">{$kb_type_description}</div>
</header>
<div class="af-kb-layout {$kb_layout_class}">
    {$kb_sidebar_html}
    {$kb_topcats_html}
    <main class="af-kb-content">
        <div class="af-kb-entries af-kb-entries--cards af-kb-category-entry-grid{$kb_entries_class}"{$kb_entries_style}>
            {$kb_entries_rows}
        </div>
    </main>
</div>
<div class="af-kb-pagination">{$kb_pagination}</div>
