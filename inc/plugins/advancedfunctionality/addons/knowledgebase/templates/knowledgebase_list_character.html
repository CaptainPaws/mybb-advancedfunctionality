<div class="{$kb_character_owner_class}">
<div class="af-ac-catalog-intro">
<div class="af-kb-header">
    <div class="af-kb-type-header">
        {$kb_type_heading}
        <div class="af-kb-type-desc">{$kb_type_description}</div>
    </div>
</div>
</div>
<div class="af-ac-catalog-toolbar">
    <form class="af-kb-search af-ac-search" method="get" action="{$kb_character_form_action}">
        {$kb_character_form_hidden}
        <label class="af-ac-search__field"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input type="text" name="q" value="{$kb_query}" placeholder="{$lang->af_kb_search_placeholder}" /></label>
    </form>
    <div class="af-kb-actions">{$kb_type_actions}{$kb_help_link}</div>
</div>
{$kb_character_filters}
<div class="af-kb-layout {$kb_layout_class}">
    {$kb_sidebar_html}
    {$kb_topcats_html}
    <main class="af-kb-content">
        <div id="kb-character-results" class="af-kb-character-results" aria-live="polite">
            {$kb_character_results}
        </div>
    </main>
</div>
</div>
