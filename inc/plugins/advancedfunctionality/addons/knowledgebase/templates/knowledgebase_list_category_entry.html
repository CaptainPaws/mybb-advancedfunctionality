<article class="af-kb-entry-card">
    <a class="af-kb-entry-card__link" href="{$kb_category_entry_url}">
        <div class="af-kb-entry-card__media">
            {$kb_category_entry_image}
        </div>
        <div class="af-kb-entry-card__body">
            <div class="af-kb-entry-card__heading">
                {$kb_category_entry_icon}
                <h2>{$kb_category_entry_title}</h2>
            </div>
            <div class="af-kb-entry-card__type">{$kb_category_entry_type}</div>
            <div class="af-kb-entry-card__description">{$kb_category_entry_short}</div>
            <div class="af-kb-entry-card__footer">
                <span><i class="fa-regular fa-file-lines" aria-hidden="true"></i>{$kb_category_entry_label}</span>
                <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
            </div>
        </div>
    </a>
</article>
